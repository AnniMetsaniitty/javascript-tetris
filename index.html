<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compton Line Legacy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Compton Line Legacy</h1>

    <div class="game">
      <canvas id="board" width="240" height="480"></canvas>

      <div class="sidebar">
        <div class="panel">
          <h2>Next</h2>
          <canvas id="next" width="96" height="96"></canvas>
        </div>

        <div class="panel stats">
          <div><span>Score</span><strong id="score">0</strong></div>
          <div><span>Lines</span><strong id="lines">0</strong></div>
          <div><span>Level</span><strong id="level">1</strong></div>
        </div>

        <div class="panel controls">
          <h2>Controls</h2>
          <ul>
            <li>← / → : Move</li>
            <li>↑ : Rotate</li>
            <li>↓ : Soft drop</li>
            <li>Space : Hard drop</li>
            <li>R : Restart</li>
            <li>P : Pause</li>
          </ul>
        </div>
      </div>
    </div>

    <footer>
      <small>
        Made by Anni Metsäniitty.
      </small>
    </footer>
  </div>

  <script src="tetris.js"></script>
</body>
</html>
