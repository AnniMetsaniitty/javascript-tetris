<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compton Line Legacy</title>
  <meta name="theme-color" content="#0a0d12">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="soundBtn" class="sound-btn floating" aria-pressed="false" title="Toggle sound">🔈</button>

  <div class="wrap">
    <header class="header" aria-label="Game header">
      <div class="brand">
        <h1>COMPTON LINE LEGACY</h1>
        <span class="tagline">Arcade classic • Cube With Attitude </span>
      </div>
    </header>

    <main class="game" aria-label="Tetris game">
      <!-- width/height attributes here are overridden by JS anyway -->
      <canvas id="board" width="360" height="720" aria-label="Tetris board" role="img"></canvas>

      <aside class="sidebar" aria-label="Sidebar">
        <section class="panel" aria-labelledby="nextLabel">
          <h2 id="nextLabel">Next</h2>
          <canvas id="next" width="132" height="132" aria-label="Next piece preview"></canvas>
        </section>

        <section class="panel stats" aria-labelledby="statsLabel">
          <h2 id="statsLabel">Stats</h2>
          <div><span>Score</span><strong id="score">0</strong></div>
          <div><span>Lines</span><strong id="lines">0</strong></div>
          <div><span>Level</span><strong id="level">1</strong></div>
        </section>

        <section class="panel controls" aria-labelledby="controlsLabel">
          <h2 id="controlsLabel">Controls</h2>
          <ul>
            <li><kbd>←</kbd> / <kbd>→</kbd> Move</li>
            <li><kbd>↑</kbd> Rotate</li>
            <li><kbd>↓</kbd> Soft drop</li>
            <li><kbd>Space</kbd> Hard drop</li>
            <li><kbd>R</kbd> Restart</li>
            <li><kbd>P</kbd> Pause</li>
          </ul>
        </section>

        <section class="panel sound-panel" aria-label="Sound">
          <span style="color: var(--muted); font-size: 14px;">Happy Gaming! </span>
        </section>
      </aside>
    </main>

    <footer>
      <small>Made by Nani</small>
      <br />
      <small>© <span id="year"></span> Compton Line Legacy</small>
    </footer>
  </div>

  <script src="tetris.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    if (typeof updateSoundBtn === "function") updateSoundBtn();
  </script>
</body>
</html>
