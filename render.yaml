services:
  - type: web
    name: compton-line-legacy
    runtime: static
    buildCommand: echo "No build needed - static site"
    staticPublishPath: .
    envVars:
      - key: NODE_VERSION
        value: 18
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.mp3
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.ttf
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
